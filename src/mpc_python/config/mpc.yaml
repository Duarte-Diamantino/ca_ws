# Parametros do MPC (mpc_python/mpc_controller), com os valores por defeito do codigo.
# Gerado a partir da lista TUNABLE do mpc_controller.py. O tools/sim.sh mpc carrega este
# ficheiro e depois ~/ca_ws/mpc_params.yaml (se existir; o "g" no terminal do MPC grava-o).
# Com o MPC a correr: ros2 param set /mpc_controller V_MAX 1.5  (usar ponto decimal nos floats)
mpc_controller:
  ros__parameters:
    V_MAX: 1.2                            # velocidade maxima [m/s] [0.2 .. 4.0]
    V_MIN: 0.2                            # velocidade minima dos planos [m/s] [0.0 .. 1.0]
    V_MAX_NOT_ALIGNED: 0.8                # velocidade maxima com rumo/erro acima dos limiares [m/s] [0.1 .. 4.0]
    ALIGN_HEADING_THRESH_DEG: 8.0         # erro de rumo acima do qual limita a V_MAX_NOT_ALIGNED [graus] [1.0 .. 45.0]
    ALIGN_CTE_THRESH: 0.08                # erro lateral acima do qual limita a V_MAX_NOT_ALIGNED [m] [0.01 .. 1.0]
    ACCEL_LIMIT: 0.5                      # aceleracao maxima do comando [m/s^2] [0.05 .. 5.0]
    DECEL_LIMIT: 1.8                      # travagem maxima do comando [m/s^2] [0.1 .. 10.0]
    MAX_LAT_ACC: 1.2                      # aceleracao lateral maxima nas curvas (velocidade de referencia) [m/s^2] [0.1 .. 10.0]
    OMEGA_MAX: 0.7                        # velocidade angular maxima [rad/s] [0.1 .. 5.0]
    w_cross_track: 15.0                   # peso: distancia ao caminho [0.0 .. 1000.0]
    w_heading: 5.0                        # peso: erro de rumo [0.0 .. 1000.0]
    w_control_effort: 0.1                 # peso: tamanho dos comandos [0.0 .. 100.0]
    w_control_smooth: 2.0                 # peso: variacao dos comandos [0.0 .. 100.0]
    w_terminal: 15.0                      # peso: distancia ao caminho no fim do horizonte [0.0 .. 1000.0]
    H_SHORT: 6                            # horizonte normal [passos de dt = 0.3 s] [2 .. 30]
    H_LONG: 16                            # horizonte longo (quando o curto colide) [passos] [4 .. 40]
    MPC_FTOL: 0.001                       # tolerancia do L-BFGS-B [1e-06 .. 0.5]
    MPC_MAXITER: 32                       # iteracoes maximas do L-BFGS-B [4 .. 200]
    TRACK_HALF_WIDTH: 0.5                 # distancia ao ponto de referencia acima da qual penaliza 1e9 [m] [0.1 .. 3.0]
    PATH_TUBE_LIMIT: 0.55                 # desvio maximo ao caminho aceite num plano [m] [0.1 .. 3.0]
    OBSTACLE_SIZE_FROM_Z: true            # usar o tamanho de cada obstaculo (pose.position.z = raio) de /obstacles (ref)  (no simulador: a GUI manda o raio em z)
    CAR_HALF_WIDTH: 0.1                   # meia largura do carro: raio duro = raio do obstaculo + isto + OBSTACLE_MARGIN [m] [0.0 .. 0.5] (ref)
    OBSTACLE_MARGIN: 0.1                  # folga entre o carro e o obstaculo [m] [0.0 .. 1.0] (ref)
    OBSTACLE_RADIUS: 0.5                  # raio duro dos obstaculos SEM tamanho (distancia ao centro do carro) [m] [0.05 .. 2.0] (ref)
    OBSTACLE_SOFT_MARGIN: 0.2             # margem do custo suave alem do raio [m] [0.0 .. 1.0]
    W_OBSTACLE_SOFT: 100000.0             # peso do custo suave dos obstaculos [0.0 .. 10000000.0]
    OBS_APPEARS_THRESH_FOR_SLOW: 0.15     # abranda (0.35 m/s) se o plano passa a raio + isto [m] [0.0 .. 1.0]
    USE_REF_SHIFT: true                   # desviar a referencia a volta dos obstaculos (ref)
    AVOID_MARGIN: 0.1                     # o caminho desviado passa a raio duro + isto do obstaculo [m] [0.0 .. 1.0] (ref)
    AVOID_RAMP: 2.0                       # comprimento das rampas do desvio [m] [0.2 .. 6.0] (ref)
    AVOID_DEFAULT_SIDE: 1.0               # obstaculo em cima do caminho: +1 esquerda, -1 direita [-1.0 .. 1.0] (ref)
    REF_SPEED_SPACING: true               # referencia espacada pela velocidade (False = 3 pontos por passo)
    REF_SPACING_LEAD: 0.15                # m/s a mais que a ultima velocidade no espacamento da referencia [0.0 .. 1.0]
    END_SLOWDOWN_REMAIN: 2.0              # comeca a abrandar a esta distancia do fim [m] [0.0 .. 10.0]
    END_STOP_REMAIN: 0.8                  # para a esta distancia do fim [m] [0.0 .. 5.0]
    REQUIRE_OBSTACLES_TO_START: true      # so arranca depois de receber /obstacles
